<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button onclick="show()">show</button>

    <script>
      show = () => {
        alert("WELCOME TO DOM");
      };
    </script>
    <hr />
    <button onclick="addData()">ADD_Data</button>
    <script>
      let addData = () => {
        let userResponse = confirm("DO YOU WANT TO CONTINUE");
        console.log(userResponse);

        if (userResponse) {
          // add the data in local storage if condition is true
          localStorage.setItem("username", "mohan");
          localStorage.setItem("age", 45);
          console.log("DATA ADDED SUCESSFULLY");
        } else {
          console.log("DATA not found");
        }
      };
    </script>
    <hr />
    <button onclick="removeData()">Remove_Data</button>
    <script>
      let removeData = () => {
        let userResponse2 = confirm("DO YOU WANT TO REMOVE DATA");
        console.log(userResponse2);

        if (userResponse2) {
          // add the data in local storage if condition is true
          localStorage.removeItem("username");
          localStorage.removeItem("age");
          alert("DATA REMOVE SUCESSFULLY");
        } else {
          console.log("DATA not removed");
        }
      };
    </script>
  </body>
</html>
